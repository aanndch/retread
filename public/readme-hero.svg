<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <radialGradient id="chromeBezel" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E1E1E1"/>
      <stop offset="70%" stop-color="#9C9C9C"/>
      <stop offset="90%" stop-color="#D6D6D6"/>
      <stop offset="100%" stop-color="#555555"/>
    </radialGradient>
    <radialGradient id="darkFace" cx="50%" cy="50%" r="45%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#3d2b1f" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#3d2b1f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3d2b1f"/>
    </radialGradient>
    <filter id="subtleWobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" fill="#f5e6c8"/>

  <!-- Typewriter Key (centered at x=400, y=75) -->
  <g transform="translate(362, 20)">
    <!-- Soft shadow -->
    <rect x="4" y="8" width="76" height="72" rx="14" ry="14" fill="rgba(60,40,20,0.10)" style="filter:url(#blur)"/>
    <!-- Chrome bezel -->
    <rect x="4" y="4" width="76" height="72" rx="14" ry="14" fill="url(#chromeBezel)"/>
    <rect x="7" y="7" width="70" height="66" rx="11" ry="11" fill="#333333"/>
    <rect x="8" y="8" width="68" height="64" rx="10" ry="10" fill="#D2D2D2"/>
    <rect x="10" y="10" width="64" height="60" rx="8" ry="8" fill="#777777"/>
    <!-- Dark keycap face -->
    <rect x="11" y="11" width="62" height="58" rx="7" ry="7" fill="url(#darkFace)"/>
    <!-- Inner rim highlight -->
    <rect x="13" y="13" width="58" height="54" rx="6" ry="6" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.15"/>
    <!-- Letter R -->
    <text
      x="42"
      y="44"
      dominant-baseline="central"
      font-family="Courier New, Courier, monospace"
      font-weight="900"
      font-size="38"
      fill="#f5e6c8"
      text-anchor="middle"
      filter="url(#subtleWobble)"
    >R</text>
  </g>

  <!-- App name -->
  <text
    x="400"
    y="140"
    text-anchor="middle"
    font-family="'Space Mono', 'Courier New', Courier, monospace"
    font-weight="700"
    font-size="36"
    fill="#3d2b1f"
    letter-spacing="2"
  >retread</text>

  <!-- Tagline -->
  <text
    x="400"
    y="172"
    text-anchor="middle"
    font-family="'Space Mono', 'Courier New', Courier, monospace"
    font-weight="400"
    font-size="14"
    fill="#7a6652"
  >A journal for well-tread journeys.</text>

  <!-- Subtle separator line -->
  <line x1="340" y1="192" x2="460" y2="192" stroke="#e6d5b0" stroke-width="1"/>

  <!-- Sub-description -->
  <text
    x="400"
    y="215"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="11"
    fill="#7a6652"
  >Private · Offline · Yours</text>
</svg>
